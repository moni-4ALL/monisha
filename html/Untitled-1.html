<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Reservation System</title>
<style>
    /* CSS styling */
    body {
        font-family: Arial, sans-serif;
    }
    .bus-info {
        margin-bottom: 10px;
    }
</style>
</head>
<body>
<h1>Bus Reservation System</h1>

<!-- Login Form -->
<div id="loginForm">
    <h2>Login</h2>
    <label for="username">Username:</label>
    <input type="text" id="username">
    <label for="password">Password:</label>
    <input type="password" id="password">
    <button onclick="login()">Login</button>
</div>

<!-- Bus Information Section -->
<div id="busList" style="display: none;"></div>

<script>
    // JavaScript code
    const validCredentials = { username: "user123", password: "pass123" };
    let isLoggedIn = false;

    const buses = [
        { id: "bus1", source: "City A", destination: "City B", seats: 50, availableSeats: 50 },
        { id: "bus2", source: "City B", destination: "City C", seats: 40, availableSeats: 40 }
    ];

    function displayBuses() {
        const busList = document.getElementById("busList");
        busList.innerHTML = "<h2>Available Buses:</h2>";
        buses.forEach(bus => {
            busList.innerHTML += `<div class="bus-info">Bus ID: ${bus.id}, Source: ${bus.source}, Destination: ${bus.destination}, Available Seats: ${bus.availableSeats}</div>`;
        });
    }

    function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        if (username === validCredentials.username && password === validCredentials.password) {
            isLoggedIn = true;
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("busList").style.display = "block";
            displayBuses();
        } else {
            alert("Invalid username or password. Please try again.");
        }
    }
</script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Reservation System</title>
<style>
    /* CSS styling */
    body {
        font-family: Arial, sans-serif;
    }
    .bus-info {
        margin-bottom: 10px;
    }
</style>
</head>
<body>
<h1>Bus Reservation System</h1>
<div id="busList"></div>
<div>
    <label for="busId">Enter Bus ID:</label>
    <input type="text" id="busId">
    <label for="numSeats">Number of Seats:</label>
    <input type="number" id="numSeats" min="1">
    <button onclick="bookSeat()">Book Seat(s)</button>
</div>

<script>
    // JavaScript code
    const buses = [
        { id: "bus1", source: "City A", destination: "City B", seats: 50, availableSeats: 50 },
        { id: "bus2", source: "City B", destination: "City C", seats: 40, availableSeats: 40 }
    ];

    function displayBuses() {
        const busList = document.getElementById("busList");
        busList.innerHTML = "<h2>Available Buses:</h2>";
        buses.forEach(bus => {
            busList.innerHTML += `<div class="bus-info">Bus ID: ${bus.id}, Source: ${bus.source}, Destination: ${bus.destination}, Available Seats: ${bus.availableSeats}</div>`;
        });
    }

    function bookSeat() {
        const busId = document.getElementById("busId").value;
        const numSeats = parseInt(document.getElementById("numSeats").value);
        const bus = buses.find(bus => bus.id === busId);
        if (bus && bus.availableSeats >= numSeats) {
            bus.availableSeats -= numSeats;
            alert(`${numSeats} seat(s) booked successfully for Bus ID: ${busId}`);
            displayBuses();
        } else {
            alert("Invalid Bus ID or not enough seats available.");
        }
    }

    displayBuses();
</script>
</body>
</html>
