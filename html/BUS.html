<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Reservation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Bus Reservation System</h1>
    </header>
    <main>
        <section id="search-section">
            <h2>Search Buses</h2>
            <form id="search-form">
                <label for="source">Source:</label>
                <input type="text" id="source" name="source" required>
                <label for="destination">Destination:</label>
                <input type="text" id="destination" name="destination" required>
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" required>
                <button type="submit">Search Buses</button>
            </form>
            <div id="search-results"></div>
        </section>
        <section id="booking-section">
            <h2>Booking Details (hidden initially)</h2>
            <form id="booking-form" style="display: none;">
                <label for="bus-id">Bus ID:</label>
                <input type="text" id="bus-id" name="bus_id" readonly>
                <label for="passenger-name">Passenger Name:</label>
                <input type="text" id="passenger-name" name="passenger_name" required>
                <button type="submit">Book Seat</button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
